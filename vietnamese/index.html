<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vietnamese</title>
    <meta name="description" content="Picture-and-word flashcards for learning Vietnamese." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2220%22%20fill%3D%22%232563eb%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2268%22%20font-size%3D%2264%22%20font-family%3D%22system-ui%2Csans-serif%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EV%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <h1>Vietnamese</h1>
      <div class="viewtoggle" role="tablist" aria-label="View">
        <button id="viewStudy" class="viewtoggle__btn is-active" type="button" role="tab" aria-selected="true">Flashcards</button>
        <button id="viewGame" class="viewtoggle__btn" type="button" role="tab" aria-selected="false">Build</button>
        <button id="viewStory" class="viewtoggle__btn" type="button" role="tab" aria-selected="false">Story</button>
        <button id="viewGrammar" class="viewtoggle__btn" type="button" role="tab" aria-selected="false">Grammar</button>
        <button id="viewTales" class="viewtoggle__btn" type="button" role="tab" aria-selected="false">Tales</button>
      </div>
      <div class="subtoggle" id="cardsSub" role="tablist" aria-label="Flashcards mode" hidden>
        <button id="subStudy" class="subtoggle__btn is-active" type="button" role="tab" aria-selected="true">Study</button>
        <button id="subAll" class="subtoggle__btn" type="button" role="tab" aria-selected="false">All cards</button>
      </div>
      <label class="speed">
        <span>Speech speed</span>
        <select id="ttsRate">
          <option value="0.4">0.4&times; slowest</option>
          <option value="0.5">0.5&times;</option>
          <option value="0.6">0.6&times;</option>
          <option value="0.75" selected>0.75&times;</option>
          <option value="0.9">0.9&times;</option>
          <option value="1">1&times; normal</option>
        </select>
      </label>
      <div class="controlsWrap" id="controlsWrap">
        <button id="filtersToggle" class="filters-toggle" type="button" aria-expanded="false">
          Show filters &#9662;
        </button>
        <div class="controls">
          <label>
            Category
            <select id="category"></select>
          </label>
          <label>
            Order
            <select id="order">
              <option value="inorder">In order</option>
              <option value="shuffle" selected>Shuffle</option>
              <option value="random">Random (endless)</option>
            </select>
          </label>
        </div>
      </div>
    </header>

    <main class="stage">
      <button class="nav nav--prev" id="prev" aria-label="Previous card">&#8249;</button>

      <div class="scene" id="scene">
        <div class="card" id="card">
          <div class="card__face card__face--front" id="front"></div>
          <div class="card__face card__face--back" id="back"></div>
        </div>
      </div>

      <button class="nav nav--next" id="next" aria-label="Next card">&#8250;</button>

      <p class="empty" id="empty" hidden>No cards match these filters. Try “All”.</p>
    </main>

    <section class="grid" id="grid" hidden></section>

    <section class="game" id="game" hidden></section>

    <section class="story" id="story" hidden></section>

    <section class="grammar" id="grammar" hidden></section>

    <section class="tales" id="tales" hidden></section>

    <footer class="statusbar">
      <span id="counter">0 / 0</span>
      <button id="reshuffle" class="btn">Shuffle</button>
      <span class="hint">Space flip · &larr; &rarr; move · S speak · R shuffle</span>
    </footer>

    <script src="cards.js"></script>
    <script src="sentences.js"></script>
    <script src="stories.js"></script>
    <script src="grammar.js"></script>
    <script src="tales.js"></script>
    <script src="app.js"></script>
  </body>
</html>
